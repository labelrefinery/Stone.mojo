[workspace]
name = "stone-mojo"
version = "0.2.0"
authors = ["Marius Seritan <marius@seritan.net>"]
description = "STONE-style annotation-free terrain traversability auto-labeling in pure Mojo"
preview = ["pixi-build"]
channels = [
    "https://conda.modular.com/max-nightly",
    "conda-forge",
]
platforms = ["osx-arm64", "linux-64", "linux-aarch64"]

[dependencies]
mojo = "==1.2.0"

[tasks]
test = { cmd = "mojo run -I src test/test_merge.mojo", description = "Patches merged into a grid, against streaming" }

# ── pixi-build: consumable as a pixi source dependency ──────────────────────
[package]
name = "stone-mojo"
version = "0.2.0"

[package.build]
backend = { name = "pixi-build-mojo", version = "0.*" }

[package.build.config.pkg]
path = "src/stone"
name = "stone"

[package.host-dependencies]
mojo-compiler = "==1.2.0"

[package.build-dependencies]
mojo-compiler = "==1.2.0"

[package.run-dependencies]
mojo-compiler = "==1.2.0"
